<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e8">
  <title>Parle &amp; Traduis</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="brand-name">Parle <i>&amp;</i> Traduis</div>
    <div class="topbar-dot" aria-hidden="true"></div>
  </header>

  <main class="page">
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">FRANÇAIS <span></span> <span id="targetCode">EN</span></p>
      <h1 id="page-title">Dites-le en français.<br><em>Comprenez-le</em> en traduction.</h1>
      <p class="lede">Une phrase à la fois, sans clavier.</p>
      <div class="language-picker">
        <label for="targetLanguage">Traduire en</label>
        <select id="targetLanguage" aria-label="Langue de traduction">
          <option value="en">Anglais</option>
          <option value="wo">Wolof</option>
          <option value="es">Espagnol</option>
          <option value="ro">Roumain</option>
          <option value="pl">Polonais</option>
        </select>
      </div>
    </section>

    <section class="listen-area" aria-label="Écoute">
      <button class="listen-button" id="listenButton" type="button" aria-describedby="listenHint">
        <span class="mic-ring" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M12 15.5a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 1 0-7 0v6a3.5 3.5 0 0 0 3.5 3.5Zm6-3.5a6 6 0 0 1-12 0M12 18v3m-3 0h6"/></svg></span>
        <span class="button-label" id="buttonLabel">Appuyer pour parler</span>
      </button>
      <p class="listen-hint" id="listenHint"><span class="pulse-dot" aria-hidden="true"></span><span id="hintText">L’écoute s’arrête automatiquement après un silence.</span></p>
    </section>

    <div class="status" id="status" role="status" aria-live="polite" hidden></div>

    <section class="results" id="results" aria-labelledby="resultsTitle" hidden>
      <div class="results-heading">
        <div>
          <p class="eyebrow">VOTRE PHRASE</p>
          <h2 id="resultsTitle">Voici ce que j’ai entendu</h2>
        </div>
        <span class="done-badge" id="doneBadge">Terminé</span>
      </div>
      <div class="translation-grid">
        <article class="result-card french-card">
          <div class="card-label"><span class="flag-dot">FR</span><span>Transcription</span></div>
          <p class="result-text" id="transcript"></p>
        </article>
        <article class="result-card english-card">
          <div class="card-label"><span class="flag-dot english-dot" id="cardTargetCode">EN</span><span>Traduction</span></div>
          <div class="result-text" id="translation"></div>
        </article>
      </div>
      <button class="again-button" id="againButton" type="button"><span aria-hidden="true">↗</span> Nouvelle phrase</button>
    </section>

    <section class="empty-state" id="emptyState" aria-label="Prêt à écouter">
      <div class="waveform" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <p>Votre traduction apparaîtra ici</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
